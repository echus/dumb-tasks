# The app is static files. Put it behind your own https proxy: browsers only run the service
# worker (offline use, installing the app) on https.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Always check for a new service worker and app shell, so updates reach installed apps
    # (as public/_headers does on Cloudflare)
    location ~ ^/(|index\.html|sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # nginx's own list of types doesn't have it
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Named by content hash, so never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
