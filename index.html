<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Dumb Tasks is a simple local-first task list. Tasks stay on your device, or sync between your devices."
    />
    <meta name="theme-color" content="#000000" />
    <title>Dumb Tasks - a really simple todo list</title>
    <!-- For search engines, and the preview card when someone shares the link. Self-hosted
         copies point here too: this is the app's home. -->
    <link rel="canonical" href="https://dumbtasks.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dumbtasks.app/" />
    <meta property="og:site_name" content="Dumb Tasks" />
    <meta property="og:title" content="Dumb Tasks - a really simple todo list" />
    <meta
      property="og:description"
      content="Dumb Tasks is a simple local-first task list. Tasks stay on your device, or sync between your devices."
    />
    <meta property="og:image" content="https://dumbtasks.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dumb Tasks: lists for today, week, month and later, each task with an emoji icon" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Dumb Tasks",
        "url": "https://dumbtasks.app/",
        "description": "Dumb Tasks is a simple local-first task list. Tasks stay on your device, or sync between your devices.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript"
      }
    </script>
    <script>
      // Apply a saved theme before first paint so the page doesn't flash
      try {
        const theme = localStorage.getItem('theme');
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- The app's empty-screen description, for anything reading the page without scripts -->
    <noscript>
      <p>
        Dumb Tasks is a simple local-first task list. Tasks stay on your device, or sync between
        your devices. <a href="/privacy">Privacy</a>
      </p>
      <p>Dumb Tasks needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
